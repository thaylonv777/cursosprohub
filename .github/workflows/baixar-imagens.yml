name: Baixar imagens
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['baixar-imagens.py', '.github/workflows/baixar-imagens.yml']
permissions:
  contents: write
jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 baixar-imagens.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add img
          git diff --cached --quiet || git commit -m "Imagens baixadas" && git push
